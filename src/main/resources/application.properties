server.port=${PORT:8080}

# Render terminates TLS at its proxy and forwards the original scheme in
# X-Forwarded-Proto. Without this, Spring builds absolute URLs (including the
# OAuth redirect_uri) as http:// and Google rejects them with
# redirect_uri_mismatch.
#
# "native" uses Tomcat's RemoteIpValve rather than Spring's ForwardedHeaderFilter.
# The valve reads X-Forwarded-For right to left and trusts only internal proxy
# addresses, so request.getRemoteAddr() is the real client IP and cannot be
# spoofed by a client-supplied header (the rate limiter relies on this).
# If Render's proxy ever arrives from a non-private address, list it in
# server.tomcat.remoteip.internal-proxies.
server.forward-headers-strategy=native

# Session cookie is not sent on cross-site POST/PUT/DELETE requests. This is the
# CSRF mitigation while Spring Security's CSRF tokens are disabled for the
# fetch-based UI. Lax still allows the top-level GET redirect back from Google.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# ---------------------------------------------------------------------------
# AI provider: Google Gemini free tier (no card, no paid provider)
# ---------------------------------------------------------------------------
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.api-key=${AI_API_KEY:unset}
spring.ai.openai.chat.options.model=gemini-3.6-flash
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.embedding.options.model=gemini-embedding-001

spring.ai.retry.max-attempts=2

# ---------------------------------------------------------------------------
# Database
# Default: in-memory HSQLDB. Free, zero setup; everything resets when the container
# restarts - the demo account and sample document are recreated on boot.
#
# For persistence, set DATABASE_URL to a PostgreSQL connection string (with the
# pgvector extension), pasted exactly as the provider shows it:
#   DATABASE_URL=postgresql://user:password@host/db?sslmode=require
# DatabaseUrlEnvironmentPostProcessor converts it into the three properties
# below and overrides any SPRING_DATASOURCE_* variables. A PostgreSQL URL also
# switches document embeddings to PgVectorStore (see VectorStoreConfig); the
# vector_store table is created on first boot.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:hsqldb:mem:aidb
spring.datasource.username=sa
spring.datasource.password=
# Spring Data JDBC does not generate tables; schema.sql creates any that are missing.
spring.sql.init.mode=always

# ---------------------------------------------------------------------------
# App
# ---------------------------------------------------------------------------
spring.application.name=ai-knowledge-assistant
# Upload limits. The multipart cap is slightly above app.documents.max-bytes so an oversized file
# still reaches the controller and gets a clear 413 message.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
app.documents.max-bytes=${DOCUMENTS_MAX_BYTES:5242880}
app.documents.max-pages=${DOCUMENTS_MAX_PAGES:50}
app.documents.max-per-user=${DOCUMENTS_MAX_PER_USER:20}
app.documents.max-chunks=${DOCUMENTS_MAX_CHUNKS:400}
# At most this many PDFs are parsed at once; others wait up to parse-wait-seconds, then get a 503.
app.documents.max-concurrent-parses=${DOCUMENTS_MAX_CONCURRENT_PARSES:2}
app.documents.parse-wait-seconds=10

# ---------------------------------------------------------------------------
# Vector store persistence
# Used only when the datasource is not PostgreSQL. Embeddings are written here
# and reloaded on startup, so documents are re-embedded once rather than on
# every boot.
#
# Render's free tier has an ephemeral filesystem: this survives a restart of a
# running instance but not a redeploy or a sleep/wake cycle. For real
# durability, set DATABASE_URL to a Postgres instance (PgVectorStore).
# ---------------------------------------------------------------------------
app.vector-store.path=${VECTOR_STORE_PATH:./data/vector-store.json}

# ---------------------------------------------------------------------------
# Health / info - used by Render and by uptime pingers
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# /actuator/health/liveness: no database or vector-store check, so Render's probe stays fast and
# never fails because the database is waking up. Use it as Render's Health Check Path.
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
info.app.name=AI Knowledge Assistant
info.app.version=1.0.0

# ---------------------------------------------------------------------------
# BYOK encryption key: base64 of 32 random bytes.
#   openssl rand -base64 32
# If unset, a per-process key is generated and stored keys are lost on restart.
# ---------------------------------------------------------------------------
app.encryption-key=${APP_ENCRYPTION_KEY:}

# force rebuild

spring.ai.vectorstore.pgvector.index-type=IVFFlat
spring.ai.vectorstore.pgvector.dimensions=768


# rebuild-20261116-133328

# ---------------------------------------------------------------------------
# Error responses: never include stack traces, exception messages or bind details.
# ---------------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
