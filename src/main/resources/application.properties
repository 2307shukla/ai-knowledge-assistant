server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# AI provider: Google Gemini (free tier, no credit card)
#
# Uses Gemini's OpenAI-compatible surface:
#   base /v1beta/openai + /chat/completions  -> chat
#   base /v1beta/openai + /embeddings        -> embeddings
# Note there is NO /v1 in these paths, unlike OpenAI.
#
# Model names are hardcoded on purpose: a blank env var on Render overrides
# a default and silently falls back to gpt-4o-mini. Only the key is external.
# ---------------------------------------------------------------------------
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.api-key=${AI_API_KEY:unset}
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.embedding.embeddings-path=/embeddings
spring.ai.openai.chat.options.model=gemini-2.5-flash
spring.ai.openai.embedding.options.model=gemini-embedding-001

# Fail fast instead of burning the free quota on retries
spring.ai.retry.max-attempts=2

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:aidb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# App
# ---------------------------------------------------------------------------
spring.application.name=ai-knowledge-assistant

# Debug only - never leave these on for a public deployment
spring.h2.console.enabled=false
spring.jpa.show-sql=false
