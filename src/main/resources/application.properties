server.port=${PORT:8080}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.mistral.ai/v1}
# fallback keeps the app bootable if the env var is missing, so you get a clear
# 401 from the provider instead of a dead service
spring.ai.openai.api-key=${AI_API_KEY:unset}
spring.ai.openai.chat.model=${AI_CHAT_MODEL:mistral-small-latest}
spring.ai.openai.chat.options.stream=false
spring.ai.openai.embedding.model=${AI_EMBED_MODEL:mistral-embed}
spring.datasource.url=jdbc:h2:mem:aidb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.application.name=ai-knowledge-assistant
spring.jpa.open-in-view=false