server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# AI provider: Google Gemini free tier (no card, no paid provider)
# ---------------------------------------------------------------------------
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.api-key=${AI_API_KEY:unset}
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.embedding.embeddings-path=/embeddings
spring.ai.openai.chat.options.model=gemini-3.6-flash
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.embedding.options.model=gemini-embedding-001

spring.ai.retry.max-attempts=2

# ---------------------------------------------------------------------------
# Database
# In-memory H2: free, zero setup. Everything resets when the container
# restarts - the demo account and sample document are recreated on boot.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:aidb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# App
# ---------------------------------------------------------------------------
spring.application.name=ai-knowledge-assistant
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------------------
# Vector store persistence
# Embeddings are written here and reloaded on startup, so documents are
# re-embedded once rather than on every boot.
#
# Render's free tier has an ephemeral filesystem: this survives a restart of a
# running instance but not a redeploy or a sleep/wake cycle. For real
# durability, point this at a mounted volume, or switch to PgVectorStore backed
# by a free Postgres instance.
# ---------------------------------------------------------------------------
app.vector-store.path=${VECTOR_STORE_PATH:./data/vector-store.json}

# ---------------------------------------------------------------------------
# Health / info - used by Render and by uptime pingers
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=AI Knowledge Assistant
info.app.version=1.0.0

# ---------------------------------------------------------------------------
# BYOK encryption key: base64 of 32 random bytes.
#   openssl rand -base64 32
# If unset, a per-process key is generated and stored keys are lost on restart.
# ---------------------------------------------------------------------------
app.encryption-key=${APP_ENCRYPTION_KEY:}
