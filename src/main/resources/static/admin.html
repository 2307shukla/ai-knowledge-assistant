<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin analytics · AI Assistant</title>
<style>
  :root { color-scheme: dark; --bg:#0b0d12; --panel:#14181f; --line:#232a36; --muted:#8b95a7; --accent:#3b82f6; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: #e6e8ee;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 32px 20px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.4px; }
  .sub { color: var(--muted); font-size: 13px; }
  .top a { color: #60a5fa; text-decoration: none; font-size: 13.5px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px;
    border-radius: 999px; font-size: 12px; font-weight: 600; margin-bottom: 20px;
  }
  .pill.up { background: #10251a; color: #4ade80; border: 1px solid #1c4530; }
  .pill.down { background: #2a1414; color: #f87171; border: 1px solid #4a1d1d; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); }
  .card .v { font-size: 26px; font-weight: 700; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 11px 14px; font-size: 13.5px; border-bottom: 1px solid var(--line); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  .role { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #1e293b; color: #93c5fd; }
  .role.ADMIN { background: #2a1d3d; color: #c4b5fd; }
  .err { color: #f87171; font-size: 13px; }
  .note { margin-top: 18px; font-size: 12.5px; color: #5f6b7d; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Admin analytics</h1>
      <div class="sub">Aggregate usage · no message content is shown</div>
    </div>
    <a href="/chat.html">← Back to chat</a>
  </div>

  <div class="pill" id="health"><span class="dot"></span> Checking health…</div>

  <div class="cards" id="cards"></div>

  <table>
    <thead>
      <tr><th>User</th><th>Role</th><th>Conversations</th><th>Messages</th></tr>
    </thead>
    <tbody id="rows"><tr><td colspan="4" class="err">Loading…</td></tr></tbody>
  </table>

  <div class="note">Access is enforced server-side with ROLE_ADMIN — this page and its API return 403 without it.</div>
</div>

<script>
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  async function loadHealth() {
    const el = document.getElementById('health');
    try {
      const res = await fetch('/actuator/health');
      const data = await res.json();
      const up = data.status === 'UP';
      el.className = 'pill ' + (up ? 'up' : 'down');
      el.innerHTML = '<span class="dot"></span> Health: ' + esc(data.status || 'UNKNOWN');
    } catch (e) {
      el.className = 'pill down';
      el.innerHTML = '<span class="dot"></span> Health check failed';
    }
  }

  async function loadStats() {
    const tbody = document.getElementById('rows');
    try {
      const res = await fetch('/api/admin/stats');
      if (res.status === 403) {
        tbody.innerHTML = '<tr><td colspan="4" class="err">403 — this account is not an administrator.</td></tr>';
        return;
      }
      if (res.status === 401) {
        location.href = '/login.html';
        return;
      }
      const data = await res.json();

      document.getElementById('cards').innerHTML = [
        ['Users', data.users],
        ['Conversations', data.conversations],
        ['Messages', data.messages],
        ['Memories', data.memories],
        ['Avg msgs / chat', data.avgMessagesPerConversation]
      ].map(([k, v]) => '<div class="card"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>').join('');

      tbody.innerHTML = (data.perUser || []).map(u => `
        <tr>
          <td>${esc(u.username)}</td>
          <td><span class="role ${u.role === 'ADMIN' ? 'ADMIN' : ''}">${esc(u.role)}</span></td>
          <td>${u.conversations}</td>
          <td>${u.messages}</td>
        </tr>`).join('') || '<tr><td colspan="4" class="err">No users yet.</td></tr>';
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="4" class="err">Error: ' + esc(e.message) + '</td></tr>';
    }
  }

  loadHealth();
  loadStats();
</script>
</body>
</html>
