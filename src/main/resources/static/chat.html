<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>
<style>
  :root { color-scheme: dark; --bg:#0b0d12; --panel:#14181f; --line:#232a36; --muted:#8b95a7; --accent:#3b82f6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: #e6e8ee; display: flex; overflow: hidden;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* ---------- sidebar ---------- */
  aside {
    width: 280px; flex: 0 0 280px; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
  }
  .brand { padding: 20px 18px 14px; font-weight: 700; letter-spacing: -0.3px; }
  .brand span { color: var(--muted); font-weight: 400; font-size: 12px; display: block; }
  .newchat {
    margin: 0 14px 14px; background: var(--accent); color: #fff; border: 0;
    padding: 10px; border-radius: 9px; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  .section {
    padding: 10px 18px 6px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.7px; color: #5f6b7d;
  }
  #conversations { overflow-y: auto; max-height: 34vh; padding: 0 8px; }
  .conv {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; font-size: 13.5px; color: #c8cfdb;
  }
  .conv:hover { background: #1b212b; }
  .conv.active { background: #1e2a3d; color: #fff; }
  .conv-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .del {
    background: none; border: 0; color: #5f6b7d; cursor: pointer;
    font-size: 16px; line-height: 1; padding: 0 2px;
  }
  .del:hover { color: #f87171; }
  .empty { padding: 8px 18px; font-size: 12.5px; color: #5f6b7d; }

  #documents { overflow-y: auto; max-height: 22vh; padding: 0 8px; }
  .doc { display: flex; align-items: center; gap: 6px; padding: 6px 10px; font-size: 12.5px; color: #c8cfdb; border-radius: 8px; }
  .doc:hover { background: #1b212b; }
  .doc-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-meta { color: #5f6b7d; font-size: 11px; white-space: nowrap; }
  .usedocs { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); white-space: nowrap; cursor: pointer; user-select: none; }
  .sources { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .source { font-size: 11.5px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: help; }

  #memories { overflow-y: auto; max-height: 24vh; padding: 0 12px; }
  .mem {
    display: flex; gap: 6px; align-items: flex-start; font-size: 12.5px;
    color: #c8cfdb; background: #0f131a; border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 9px; margin: 5px 0;
  }
  .mem span { flex: 1; word-break: break-word; }
  .memadd { display: flex; gap: 6px; padding: 8px 12px; }
  .memadd input {
    flex: 1; background: #0b0d12; border: 1px solid #2a3140; color: #e6e8ee;
    border-radius: 7px; padding: 7px 9px; font-size: 12.5px; outline: none;
  }
  .memadd button {
    background: #1e293b; border: 1px solid #334155; color: #c8cfdb;
    border-radius: 7px; padding: 0 11px; cursor: pointer;
  }
  .foot {
    margin-top: auto; border-top: 1px solid var(--line); padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--muted);
  }
  .foot a { color: #60a5fa; text-decoration: none; font-size: 12.5px; }

  /* ---------- main ---------- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 28px 24px; }
  .welcome { color: #5f6b7d; text-align: center; margin-top: 18vh; font-size: 14px; }
  .msg { max-width: 760px; margin: 0 auto 18px; display: flex; gap: 12px; }
  .avatar {
    width: 28px; height: 28px; border-radius: 7px; flex: 0 0 28px;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
  }
  .msg.user .avatar { background: #1e2a3d; color: #93c5fd; }
  .msg.assistant .avatar { background: #10251a; color: #4ade80; }
  .bubble { flex: 1; white-space: pre-wrap; word-break: break-word; padding-top: 2px; }
  .msg.assistant .bubble { color: #d5dbe6; }

  form.composer {
    border-top: 1px solid var(--line); padding: 14px 24px 20px;
    display: flex; gap: 10px; max-width: 820px; margin: 0 auto; width: 100%;
  }
  textarea {
    flex: 1; resize: none; background: #14181f; border: 1px solid #2a3140;
    color: #e6e8ee; border-radius: 10px; padding: 12px 14px; font: inherit;
    outline: none; max-height: 160px;
  }
  textarea:focus { border-color: var(--accent); }
  .send {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 0 20px; font-weight: 600; cursor: pointer;
  }
  .send:disabled { opacity: 0.45; cursor: default; }

  /* ---------- toolbar buttons ---------- */
  .tool {
    background: #1e293b; border: 1px solid #334155; color: #c8cfdb;
    border-radius: 10px; width: 44px; flex: 0 0 44px; font-size: 16px; cursor: pointer;
  }
  .tool:hover { border-color: #475569; }
  .tool svg { display: block; margin: 0 auto; }
  .tool.active { border-color: #ef4444; color: #f87171; }
  .tool:disabled { opacity: 0.4; cursor: default; }

  /* ---------- markdown ---------- */
  .bubble.md { white-space: normal; }
  .bubble.md p { margin: 0 0 10px; }
  .bubble.md p:last-child { margin-bottom: 0; }
  .bubble.md ul, .bubble.md ol { margin: 0 0 10px; padding-left: 22px; }
  .bubble.md li { margin: 3px 0; }
  .bubble.md h1, .bubble.md h2, .bubble.md h3, .bubble.md h4 { font-size: 16px; margin: 16px 0 8px; }
  .bubble.md code { background: #1c222c; padding: 2px 5px; border-radius: 4px; font-size: 13px; }
  .bubble.md pre {
    background: #0b0d12; border: 1px solid #232a36; border-radius: 8px;
    padding: 12px; overflow-x: auto; margin: 0 0 10px;
  }
  .bubble.md pre code { background: none; padding: 0; font-size: 13px; }
  .bubble.md blockquote {
    border-left: 3px solid #334155; margin: 0 0 10px; padding-left: 12px; color: #a8b1c2;
  }
  .bubble.md table { border-collapse: collapse; margin-bottom: 10px; }
  .bubble.md th, .bubble.md td { border: 1px solid #2a3140; padding: 6px 10px; font-size: 13.5px; }
  .speak {
    background: none; border: 0; color: #5f6b7d; cursor: pointer;
    font-size: 13px; padding: 6px 0 0 4px;
  }
  .speak:hover { color: #93c5fd; }
  .speak.copy-msg { margin-left: 10px; font-size: 11.5px; }
  .bubble.md pre { position: relative; }
  .bubble.md pre .copy {
    position: absolute; top: 8px; right: 8px; background: #1e293b;
    border: 1px solid #334155; color: #c8cfdb; border-radius: 6px;
    font-size: 11px; padding: 3px 9px; cursor: pointer;
    opacity: 0; transition: opacity 0.15s;
  }
  .bubble.md pre:hover .copy { opacity: 1; }
  .copy:hover { border-color: #475569; }
  .meta { font-size: 11px; color: #5f6b7d; margin-top: 8px; }

  /* ---------- BYOK ---------- */
  .byok { padding: 0 12px 10px; }
  #byokStatus { font-size: 12px; color: #93c5fd; margin-bottom: 7px; }
  #byokStatus.empty { color: #5f6b7d; }
  .byok input {
    width: 100%; background: #0b0d12; border: 1px solid #2a3140; color: #e6e8ee;
    border-radius: 7px; padding: 7px 9px; font-size: 12px; outline: none;
    font-family: ui-monospace, monospace;
  }
  .byok-actions { display: flex; gap: 6px; margin-top: 7px; }
  .byok-actions button {
    flex: 1; background: #1e293b; border: 1px solid #334155; color: #c8cfdb;
    border-radius: 7px; padding: 6px 0; font-size: 12px; cursor: pointer;
  }
  .byok-actions button:hover { border-color: #475569; }

  /* ---------- mobile ---------- */
  .mobilebar { display: none; }
  #scrim { display: none; }

  @media (max-width: 760px) {
    body { display: block; }

    aside {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 30;
      width: 84vw; max-width: 320px;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
    }
    aside.open { transform: translateX(0); }

    #scrim.open {
      display: block; position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.55); z-index: 25;
    }

    main { height: 100vh; }
    .mobilebar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .mobilebar button {
      background: none; border: 1px solid var(--line); color: #c8cfdb;
      border-radius: 8px; padding: 5px 9px; cursor: pointer;
    }
    .mobilebar span { font-weight: 600; font-size: 14px; }
    #messages { padding: 16px 14px; }
    form.composer { padding: 10px 12px 16px; }
    .tool { width: 40px; flex: 0 0 40px; }
  }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">

</head>
<body>
<div id="scrim"></div>
<aside>
  <div class="brand">AI Assistant<span>Spring AI · Gemini</span></div>
  <button class="newchat" id="newChat">+ New chat</button>

  <div class="section">Chats</div>
  <div id="conversations"></div>

  <div class="section">Documents</div>
  <div id="documents"><div class="empty">Loading…</div></div>

  <div class="section">Memory</div>
  <div id="memories"></div>
  <div class="memadd">
    <input id="memoryInput" placeholder="Add a fact about you…">
    <button id="addMemory" title="Save">+</button>
  </div>

  <div class="section">Your API key</div>
  <div class="byok">
    <div id="byokStatus" class="empty">Checking…</div>
    <input id="byokInput" type="password" placeholder="Paste your Gemini key" autocomplete="off">
    <div class="byok-actions">
      <button id="byokSave" type="button">Save</button>
      <button id="byokClear" type="button">Remove</button>
    </div>
  </div>

  <div class="foot">
    <span id="who">…</span>
    <a href="/logout">Sign out</a>
  </div>
</aside>

<main>
  <div class="mobilebar">
    <button id="menuBtn" aria-label="Open menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span>AI Assistant</span>
  </div>
  <div id="messages"><div class="welcome">Loading…</div></div>
  <form class="composer" id="composer">
    <input type="file" id="fileInput" accept=".pdf,application/pdf" hidden>
    <button type="button" class="tool" id="attachBtn" title="Add a PDF to your private library" aria-label="Attach a document">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
    </button>
    <button type="button" class="tool" id="micBtn" title="Speak your message" aria-label="Voice input">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <label class="usedocs" title="Answer from your documents and cite the pages"><input type="checkbox" id="useDocs"> Use my documents</label>
    <textarea id="input" rows="1" placeholder="Message the assistant…"></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
<script>
  let currentId = null;

  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  async function api(path, opts = {}) {
    const res = await fetch(path, opts);
    if (res.status === 401) { location.href = '/login.html'; throw new Error('Not signed in'); }
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text }; }
    if (!res.ok) throw new Error((data && (data.error || data.detail)) || ('HTTP ' + res.status));
    return data;
  }

  // ---------------- conversations ----------------
  async function fetchConversations() {
    return await api('/api/conversations');
  }

  async function renderConversations(list) {
    const el = document.getElementById('conversations');
    if (!list.length) {
      el.innerHTML = '<div class="empty">No chats yet</div>';
      return;
    }
    el.innerHTML = list.map(c => `
      <div class="conv ${c.id === currentId ? 'active' : ''}" data-id="${c.id}">
        <span class="conv-title">${esc(c.title)}</span>
        <button class="del" data-del="${c.id}" title="Delete chat">&times;</button>
      </div>`).join('');

    el.querySelectorAll('.conv').forEach(node => {
      node.addEventListener('click', (e) => {
        if (e.target.dataset.del) return;
        selectConversation(Number(node.dataset.id));
      });
    });
    el.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        await api('/api/conversations/' + btn.dataset.del, { method: 'DELETE' });
        if (Number(btn.dataset.del) === currentId) currentId = null;
        await refreshConversations();
        if (!currentId) await newChat();
      });
    });
  }

  async function refreshConversations() {
    const list = await fetchConversations();
    await renderConversations(list);
    return list;
  }

  async function selectConversation(id) {
    currentId = id;
    closeMenu();
    await refreshConversations();
    const msgs = await api('/api/conversations/' + id + '/messages');
    const box = document.getElementById('messages');
    if (!msgs.length) {
      box.innerHTML = '<div class="welcome">New chat. Ask anything.</div>';
    } else {
      box.innerHTML = '';
      msgs.forEach(m => appendMessage(m.role, m.content));
    }
    box.scrollTop = box.scrollHeight;
  }

  async function newChat() {
    const created = await api('/api/conversations', { method: 'POST' });
    currentId = created.id;
    closeMenu();
    await refreshConversations();
    document.getElementById('messages').innerHTML =
      '<div class="welcome">New chat. Ask anything.</div>';
    document.getElementById('input').focus();
  }

  // ---------------- messages ----------------
  function appendMessage(role, content) {
    const box = document.getElementById('messages');
    const welcome = box.querySelector('.welcome');
    if (welcome) welcome.remove();

    const row = document.createElement('div');
    row.className = 'msg ' + role;
    row.innerHTML = `
      <div class="avatar">${role === 'user' ? 'You' : 'AI'}</div>
      <div class="bubble${role === 'assistant' ? ' md' : ''}"></div>`;
    const bubble = row.querySelector('.bubble');

    if (role === 'assistant' && window.marked && window.DOMPurify) {
      bubble.innerHTML = DOMPurify.sanitize(marked.parse(content));
      bubble.querySelectorAll('pre code').forEach(el => {
        try { hljs.highlightElement(el); } catch (e) { /* ignore */ }
      });

      const speak = document.createElement('button');
      speak.type = 'button';
      speak.className = 'speak';
      speak.textContent = '🔊';
      speak.title = 'Read aloud';
      speak.addEventListener('click', () => speakText(content));
      bubble.appendChild(speak);
    } else {
      bubble.textContent = content;
    }

    box.appendChild(row);
    box.scrollTop = box.scrollHeight;
  }

  let lastSources = [];

  // Source chips under an answer: file and page, with the passage as a tooltip.
  function renderSources(bubble, sources) {
    if (!sources || !sources.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'sources';
    for (const s of sources) {
      const chip = document.createElement('span');
      chip.className = 'source';
      chip.textContent = '[' + s.index + '] ' + s.file + (s.page ? ', p. ' + s.page : '');
      chip.title = s.snippet || '';
      wrap.appendChild(chip);
    }
    bubble.appendChild(wrap);
  }

  async function streamReply(conversationId, text, onPartial) {
    const res = await fetch('/api/conversations/' + conversationId + '/messages/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content: text, useDocuments: document.getElementById('useDocs').checked })
    });

    if (res.status === 401) { location.href = '/login.html'; throw new Error('Not signed in'); }
    if (!res.ok) {
      const body = await res.json().catch(() => null);
      throw new Error((body && body.error) || ('HTTP ' + res.status));
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let full = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let sep;
      while ((sep = buffer.indexOf('\n\n')) >= 0) {
        const raw = buffer.slice(0, sep);
        buffer = buffer.slice(sep + 2);

        let data = '';
        for (const line of raw.split('\n')) {
          if (line.startsWith('data:')) data += line.slice(5).trim();
        }
        if (!data) continue;

        let parsed;
        try { parsed = JSON.parse(data); } catch { continue; }

        if (typeof parsed === 'string') {
          full += parsed;
          onPartial(full);
        } else if (parsed && Array.isArray(parsed.sources)) {
          lastSources = parsed.sources;
        } else if (parsed && parsed.error) {
          throw new Error(parsed.error);
        }
      }
    }
    return full;
  }

  function renderAssistant(bubble, text, seconds) {
    if (window.marked && window.DOMPurify) {
      bubble.innerHTML = DOMPurify.sanitize(marked.parse(text));

      bubble.querySelectorAll('pre').forEach(pre => {
        const code = pre.querySelector('code');
        if (code) { try { hljs.highlightElement(code); } catch (e) { /* ignore */ } }

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'copy';
        btn.textContent = 'Copy';
        btn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(code ? code.innerText : pre.innerText);
            btn.textContent = 'Copied';
            setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
          } catch (e) { btn.textContent = 'Failed'; }
        });
        pre.appendChild(btn);
      });
    } else {
      bubble.textContent = text;
    }

    const speak = document.createElement('button');
    speak.type = 'button';
    speak.className = 'speak';
    speak.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>';
    speak.title = 'Read aloud';
    speak.addEventListener('click', () => speakText(text));
    bubble.appendChild(speak);

    const copyAll = document.createElement('button');
    copyAll.type = 'button';
    copyAll.className = 'speak copy-msg';
    copyAll.textContent = 'Copy';
    copyAll.title = 'Copy this message';
    copyAll.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(text);
        copyAll.textContent = 'Copied';
        setTimeout(() => { copyAll.textContent = 'Copy'; }, 1500);
      } catch (e) {
        copyAll.textContent = 'Failed';
      }
    });
    bubble.appendChild(copyAll);

    if (seconds != null) {
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = '⏱ ' + seconds.toFixed(1) + 's';
      bubble.appendChild(meta);
    }
  }

  async function sendMessage(text) {
    if (!text || !currentId) return;
    appendMessage('user', text);

    const box = document.getElementById('messages');
    const welcome = box.querySelector('.welcome');
    if (welcome) welcome.remove();

    const row = document.createElement('div');
    row.className = 'msg assistant';
    row.innerHTML = '<div class="avatar">AI</div><div class="bubble md"></div>';
    box.appendChild(row);
    const bubble = row.querySelector('.bubble');
    box.scrollTop = box.scrollHeight;

    const send = document.getElementById('send');
    send.disabled = true;
    const started = performance.now();
    let full = '';
    lastSources = [];

    try {
      full = await streamReply(currentId, text, partial => {
        full = partial;
        bubble.textContent = partial;
        box.scrollTop = box.scrollHeight;
      });
      renderAssistant(bubble, full, (performance.now() - started) / 1000);
      renderSources(bubble, lastSources);
      await refreshConversations();
    } catch (e) {
      renderAssistant(bubble, full || ('Error: ' + e.message), null);
    } finally {
      send.disabled = false;
    }
  }

  // ---------------- memory ----------------
  async function loadMemories() {
    const list = await api('/api/memories');
    const el = document.getElementById('memories');
    if (!list.length) {
      el.innerHTML = '<div class="empty">Nothing saved yet</div>';
      return;
    }
    el.innerHTML = list.map(m => `
      <div class="mem">
        <span>${esc(m.content)}</span>
        <button class="del" data-mem="${m.id}" title="Forget">&times;</button>
      </div>`).join('');

    el.querySelectorAll('[data-mem]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await api('/api/memories/' + btn.dataset.mem, { method: 'DELETE' });
        await loadMemories();
      });
    });
  }

  async function addMemory() {
    const input = document.getElementById('memoryInput');
    const content = input.value.trim();
    if (!content) return;
    input.value = '';
    try {
      await api('/api/memories', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });
      await loadMemories();
    } catch (e) {
      alert('Could not save: ' + e.message);
    }
  }

  // ---------------- wiring ----------------
  document.getElementById('newChat').addEventListener('click', newChat);
  document.getElementById('addMemory').addEventListener('click', addMemory);
  document.getElementById('memoryInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addMemory(); }
  });

  document.getElementById('composer').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('input');
    const text = input.value.trim();
    input.value = '';
    input.style.height = 'auto';
    await sendMessage(text);
  });

  const ta = document.getElementById('input');
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('composer').requestSubmit();
    }
  });
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
  });

  // ---------------- voice ----------------
  const synth = window.speechSynthesis;
  function speakText(text) {
    if (!synth) return;
    synth.cancel();
    const utter = new SpeechSynthesisUtterance(String(text).replace(/[#*`_>]/g, ''));
    utter.lang = 'en-US';
    synth.speak(utter);
  }

  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('micBtn');
  if (SpeechRecognitionCtor) {
    const recognition = new SpeechRecognitionCtor();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onresult = (event) => {
      const said = event.results[0][0].transcript;
      const box = document.getElementById('input');
      box.value = (box.value ? box.value + ' ' : '') + said;
      box.focus();
    };
    recognition.onend = () => micBtn.classList.remove('active');
    recognition.onerror = () => micBtn.classList.remove('active');
    micBtn.addEventListener('click', () => {
      micBtn.classList.add('active');
      try { recognition.start(); } catch (e) { micBtn.classList.remove('active'); }
    });
  } else {
    micBtn.disabled = true;
    micBtn.title = 'Speech recognition is not supported in this browser';
  }

  // ---------------- document upload ----------------
  const fileInput = document.getElementById('fileInput');
  const attachBtn = document.getElementById('attachBtn');

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    attachBtn.disabled = true;
    appendMessage('assistant', 'Reading **' + file.name + '** …');
    try {
      const form = new FormData();
      form.append('file', file);
      const res = await fetch('/api/rag/upload', { method: 'POST', body: form });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        appendMessage('assistant', 'Could not add that file. ' + (data.error || ('HTTP ' + res.status)));
      } else {
        const preview = (data.preview || '').split('\n').map(line => '> ' + line).join('\n');
        appendMessage('assistant',
          'Added **' + data.file + '** to your private library\n\n'
          + '- pages: ' + data.pages + '\n'
          + '- passages: ' + data.chunks + '\n\n'
          + '"Use my documents" is now on, so answers cite this file.\n\n'
          + 'Extracted text (start):\n\n' + preview);
        document.getElementById('useDocs').checked = true;
        await loadDocuments();
      }
    } catch (e) {
      appendMessage('assistant', 'Upload failed: ' + e.message);
    } finally {
      attachBtn.disabled = false;
      fileInput.value = '';
    }
  });

  // ---------------- document library ----------------
  async function loadDocuments() {
    const el = document.getElementById('documents');
    try {
      const data = await api('/api/rag/documents');
      const docs = data.documents || [];
      if (!docs.length) {
        el.innerHTML = '<div class="empty">No documents yet. Use the paperclip to add a PDF.</div>';
        return;
      }
      el.innerHTML = docs.map(d => `
        <div class="doc" title="${esc(d.file)}">
          <span class="doc-name">${esc(d.file)}</span>
          <span class="doc-meta">${d.shared ? 'sample' : (d.pages ? d.pages + ' p' : '')}</span>
          ${d.canDelete ? `<button class="del" data-reindex="${esc(d.id)}" title="Re-index">&#8635;</button>
          <button class="del" data-deldoc="${esc(d.id)}" title="Delete">&times;</button>` : ''}
        </div>`).join('');
    } catch (e) {
      el.innerHTML = '<div class="empty">Could not load documents.</div>';
    }
  }

  document.getElementById('documents').addEventListener('click', async ev => {
    const del = ev.target.closest('[data-deldoc]');
    const re = ev.target.closest('[data-reindex]');
    try {
      if (del) {
        if (!confirm('Delete this document? Its passages are removed from search.')) return;
        await fetch('/api/rag/documents/' + encodeURIComponent(del.dataset.deldoc), { method: 'DELETE' });
      } else if (re) {
        re.disabled = true;
        const res = await fetch('/api/rag/documents/' + encodeURIComponent(re.dataset.reindex) + '/reindex', { method: 'POST' });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          alert(body.error || ('HTTP ' + res.status));
        }
      } else {
        return;
      }
    } finally {
      await loadDocuments();
    }
  });

  // ---------------- BYOK ----------------
  async function loadKey() {
    const el = document.getElementById('byokStatus');
    try {
      const d = await api('/api/keys');
      if (d.configured) {
        el.textContent = 'Using your key (' + (d.hint || '****') + ')';
        el.classList.remove('empty');
      } else {
        el.textContent = 'Using the shared demo key';
        el.classList.add('empty');
      }
    } catch (e) {
      el.textContent = 'Could not read key status';
      el.classList.add('empty');
    }
  }

  document.getElementById('byokSave').addEventListener('click', async () => {
    const input = document.getElementById('byokInput');
    const key = input.value.trim();
    if (!key) return;
    try {
      await api('/api/keys', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ apiKey: key })
      });
      input.value = '';
      await loadKey();
    } catch (e) {
      alert('Could not save the key: ' + e.message);
    }
  });

  document.getElementById('byokClear').addEventListener('click', async () => {
    try {
      await api('/api/keys', { method: 'DELETE' });
      await loadKey();
    } catch (e) {
      alert('Could not remove the key: ' + e.message);
    }
  });

  // ---------------- mobile menu ----------------
  const asideEl = document.querySelector('aside');
  const scrim = document.getElementById('scrim');
  const menuBtn = document.getElementById('menuBtn');

  function closeMenu() {
    asideEl.classList.remove('open');
    scrim.classList.remove('open');
  }

  menuBtn.addEventListener('click', () => {
    asideEl.classList.add('open');
    scrim.classList.add('open');
  });
  scrim.addEventListener('click', closeMenu);

  (async function init() {
    try {
      const me = await api('/api/auth/me');
      document.getElementById('who').textContent = me.displayName || me.username;
      await loadMemories();
      await loadDocuments();
      await loadKey();
      const list = await refreshConversations();
      if (list.length) {
        await selectConversation(list[0].id);
      } else {
        await newChat();
      }
    } catch (e) {
      document.getElementById('messages').innerHTML =
        '<div class="welcome">Could not load: ' + esc(e.message) + '</div>';
    }
  })();
</script>
</body>
</html>
