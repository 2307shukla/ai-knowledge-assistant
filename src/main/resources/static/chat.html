<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>
<style>
  :root { color-scheme: dark; --bg:#0b0d12; --panel:#14181f; --line:#232a36; --muted:#8b95a7; --accent:#3b82f6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: #e6e8ee; display: flex; overflow: hidden;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* ---------- sidebar ---------- */
  aside {
    width: 280px; flex: 0 0 280px; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
  }
  .brand { padding: 20px 18px 14px; font-weight: 700; letter-spacing: -0.3px; }
  .brand span { color: var(--muted); font-weight: 400; font-size: 12px; display: block; }
  .newchat {
    margin: 0 14px 14px; background: var(--accent); color: #fff; border: 0;
    padding: 10px; border-radius: 9px; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  .section {
    padding: 10px 18px 6px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.7px; color: #5f6b7d;
  }
  #conversations { overflow-y: auto; max-height: 34vh; padding: 0 8px; }
  .conv {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; font-size: 13.5px; color: #c8cfdb;
  }
  .conv:hover { background: #1b212b; }
  .conv.active { background: #1e2a3d; color: #fff; }
  .conv-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .del {
    background: none; border: 0; color: #5f6b7d; cursor: pointer;
    font-size: 16px; line-height: 1; padding: 0 2px;
  }
  .del:hover { color: #f87171; }
  .empty { padding: 8px 18px; font-size: 12.5px; color: #5f6b7d; }

  #memories { overflow-y: auto; max-height: 24vh; padding: 0 12px; }
  .mem {
    display: flex; gap: 6px; align-items: flex-start; font-size: 12.5px;
    color: #c8cfdb; background: #0f131a; border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 9px; margin: 5px 0;
  }
  .mem span { flex: 1; word-break: break-word; }
  .memadd { display: flex; gap: 6px; padding: 8px 12px; }
  .memadd input {
    flex: 1; background: #0b0d12; border: 1px solid #2a3140; color: #e6e8ee;
    border-radius: 7px; padding: 7px 9px; font-size: 12.5px; outline: none;
  }
  .memadd button {
    background: #1e293b; border: 1px solid #334155; color: #c8cfdb;
    border-radius: 7px; padding: 0 11px; cursor: pointer;
  }
  .foot {
    margin-top: auto; border-top: 1px solid var(--line); padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: var(--muted);
  }
  .foot a { color: #60a5fa; text-decoration: none; font-size: 12.5px; }

  /* ---------- main ---------- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 28px 24px; }
  .welcome { color: #5f6b7d; text-align: center; margin-top: 18vh; font-size: 14px; }
  .msg { max-width: 760px; margin: 0 auto 18px; display: flex; gap: 12px; }
  .avatar {
    width: 28px; height: 28px; border-radius: 7px; flex: 0 0 28px;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
  }
  .msg.user .avatar { background: #1e2a3d; color: #93c5fd; }
  .msg.assistant .avatar { background: #10251a; color: #4ade80; }
  .bubble { flex: 1; white-space: pre-wrap; word-break: break-word; padding-top: 2px; }
  .msg.assistant .bubble { color: #d5dbe6; }

  form.composer {
    border-top: 1px solid var(--line); padding: 14px 24px 20px;
    display: flex; gap: 10px; max-width: 820px; margin: 0 auto; width: 100%;
  }
  textarea {
    flex: 1; resize: none; background: #14181f; border: 1px solid #2a3140;
    color: #e6e8ee; border-radius: 10px; padding: 12px 14px; font: inherit;
    outline: none; max-height: 160px;
  }
  textarea:focus { border-color: var(--accent); }
  .send {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 0 20px; font-weight: 600; cursor: pointer;
  }
  .send:disabled { opacity: 0.45; cursor: default; }
</style>
</head>
<body>
<aside>
  <div class="brand">AI Assistant<span>Spring AI · Gemini</span></div>
  <button class="newchat" id="newChat">+ New chat</button>

  <div class="section">Chats</div>
  <div id="conversations"></div>

  <div class="section">Memory</div>
  <div id="memories"></div>
  <div class="memadd">
    <input id="memoryInput" placeholder="Add a fact about you…">
    <button id="addMemory" title="Save">+</button>
  </div>

  <div class="foot">
    <span id="who">…</span>
    <a href="/logout">Sign out</a>
  </div>
</aside>

<main>
  <div id="messages"><div class="welcome">Loading…</div></div>
  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Message the assistant…"></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</main>

<script>
  let currentId = null;

  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  async function api(path, opts = {}) {
    const res = await fetch(path, opts);
    if (res.status === 401) { location.href = '/login.html'; throw new Error('Not signed in'); }
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text }; }
    if (!res.ok) throw new Error((data && (data.error || data.detail)) || ('HTTP ' + res.status));
    return data;
  }

  // ---------------- conversations ----------------
  async function fetchConversations() {
    return await api('/api/conversations');
  }

  async function renderConversations(list) {
    const el = document.getElementById('conversations');
    if (!list.length) {
      el.innerHTML = '<div class="empty">No chats yet</div>';
      return;
    }
    el.innerHTML = list.map(c => `
      <div class="conv ${c.id === currentId ? 'active' : ''}" data-id="${c.id}">
        <span class="conv-title">${esc(c.title)}</span>
        <button class="del" data-del="${c.id}" title="Delete chat">&times;</button>
      </div>`).join('');

    el.querySelectorAll('.conv').forEach(node => {
      node.addEventListener('click', (e) => {
        if (e.target.dataset.del) return;
        selectConversation(Number(node.dataset.id));
      });
    });
    el.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        await api('/api/conversations/' + btn.dataset.del, { method: 'DELETE' });
        if (Number(btn.dataset.del) === currentId) currentId = null;
        await refreshConversations();
        if (!currentId) await newChat();
      });
    });
  }

  async function refreshConversations() {
    const list = await fetchConversations();
    await renderConversations(list);
    return list;
  }

  async function selectConversation(id) {
    currentId = id;
    await refreshConversations();
    const msgs = await api('/api/conversations/' + id + '/messages');
    const box = document.getElementById('messages');
    if (!msgs.length) {
      box.innerHTML = '<div class="welcome">New chat. Ask anything.</div>';
    } else {
      box.innerHTML = '';
      msgs.forEach(m => appendMessage(m.role, m.content));
    }
    box.scrollTop = box.scrollHeight;
  }

  async function newChat() {
    const created = await api('/api/conversations', { method: 'POST' });
    currentId = created.id;
    await refreshConversations();
    document.getElementById('messages').innerHTML =
      '<div class="welcome">New chat. Ask anything.</div>';
    document.getElementById('input').focus();
  }

  // ---------------- messages ----------------
  function appendMessage(role, content) {
    const box = document.getElementById('messages');
    const welcome = box.querySelector('.welcome');
    if (welcome) welcome.remove();

    const row = document.createElement('div');
    row.className = 'msg ' + role;
    row.innerHTML = `
      <div class="avatar">${role === 'user' ? 'You' : 'AI'}</div>
      <div class="bubble">${esc(content)}</div>`;
    box.appendChild(row);
    box.scrollTop = box.scrollHeight;
  }

  async function sendMessage(text) {
    if (!text || !currentId) return;
    appendMessage('user', text);
    const send = document.getElementById('send');
    send.disabled = true;
    try {
      const data = await api('/api/conversations/' + currentId + '/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: text })
      });
      appendMessage('assistant', data.reply);
      await refreshConversations();
    } catch (e) {
      appendMessage('assistant', 'Error: ' + e.message);
    } finally {
      send.disabled = false;
    }
  }

  // ---------------- memory ----------------
  async function loadMemories() {
    const list = await api('/api/memories');
    const el = document.getElementById('memories');
    if (!list.length) {
      el.innerHTML = '<div class="empty">Nothing saved yet</div>';
      return;
    }
    el.innerHTML = list.map(m => `
      <div class="mem">
        <span>${esc(m.content)}</span>
        <button class="del" data-mem="${m.id}" title="Forget">&times;</button>
      </div>`).join('');

    el.querySelectorAll('[data-mem]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await api('/api/memories/' + btn.dataset.mem, { method: 'DELETE' });
        await loadMemories();
      });
    });
  }

  async function addMemory() {
    const input = document.getElementById('memoryInput');
    const content = input.value.trim();
    if (!content) return;
    input.value = '';
    try {
      await api('/api/memories', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });
      await loadMemories();
    } catch (e) {
      alert('Could not save: ' + e.message);
    }
  }

  // ---------------- wiring ----------------
  document.getElementById('newChat').addEventListener('click', newChat);
  document.getElementById('addMemory').addEventListener('click', addMemory);
  document.getElementById('memoryInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addMemory(); }
  });

  document.getElementById('composer').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('input');
    const text = input.value.trim();
    input.value = '';
    input.style.height = 'auto';
    await sendMessage(text);
  });

  const ta = document.getElementById('input');
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('composer').requestSubmit();
    }
  });
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 160) + 'px';
  });

  (async function init() {
    try {
      const me = await api('/api/auth/me');
      document.getElementById('who').textContent = me.displayName || me.username;
      await loadMemories();
      const list = await refreshConversations();
      if (list.length) {
        await selectConversation(list[0].id);
      } else {
        await newChat();
      }
    } catch (e) {
      document.getElementById('messages').innerHTML =
        '<div class="welcome">Could not load: ' + esc(e.message) + '</div>';
    }
  })();
</script>
</body>
</html>
