<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · AI Assistant</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0b0d12; color: #e6e8ee; padding: 24px;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: min(400px, 100%); background: #14181f; border: 1px solid #232a36;
    border-radius: 16px; padding: 32px;
  }
  h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.4px; }
  .sub { color: #8b95a7; font-size: 13px; margin-bottom: 24px; }
  label { display: block; font-size: 12px; color: #8b95a7; text-transform: uppercase;
          letter-spacing: 0.5px; margin-bottom: 7px; }
  input {
    width: 100%; background: #0b0d12; border: 1px solid #2a3140; color: #e6e8ee;
    padding: 12px 13px; border-radius: 9px; font-size: 14px; outline: none; margin-bottom: 16px;
  }
  input:focus { border-color: #3b82f6; }
  button {
    width: 100%; background: #3b82f6; color: #fff; border: 0; padding: 12px;
    border-radius: 9px; font-weight: 600; font-size: 15px; cursor: pointer;
  }
  .msg { border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px; }
  .err { background: #2a1414; border: 1px solid #4a1d1d; color: #f87171; }
  .ok  { background: #10251a; border: 1px solid #1c4530; color: #4ade80; }
  .demo {
    margin-top: 22px; padding-top: 18px; border-top: 1px solid #232a36;
    font-size: 12.5px; color: #8b95a7; line-height: 1.7;
  }
  code { background: #1c222c; padding: 2px 7px; border-radius: 5px; color: #93c5fd; }
  .foot { margin-top: 18px; text-align: center; font-size: 13px; color: #8b95a7; }
  a { color: #60a5fa; text-decoration: none; }

  .oauth {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 11px; border-radius: 9px; text-decoration: none;
    background: #fff; color: #1f2937; font-weight: 600; font-size: 14.5px;
    border: 1px solid #d1d5db; margin-bottom: 18px;
  }
  .oauth:hover { background: #f3f4f6; }
  .divider {
    text-align: center; font-size: 11px; color: #5f6b7d;
    margin-bottom: 18px; text-transform: uppercase; letter-spacing: 0.7px;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Welcome back</h1>
    <div class="sub">Sign in to continue your conversations</div>

    <div id="banner"></div>

    <div id="oauthBlock" style="display:none">
      <a class="oauth" href="/oauth2/authorization/google">
        <svg width="17" height="17" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </a>
      <div class="divider">or sign in with username</div>
    </div>

    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit">Sign in</button>
    </form>

    <div class="demo">
      <strong style="color:#c8cfdb">Demo account</strong><br>
      Username <code>demo</code> &nbsp; Password <code>demo123</code>
    </div>

    <div class="foot">No account? <a href="/register.html">Create one</a></div>
  </main>

<script>
  const params = new URLSearchParams(location.search);
  const banner = document.getElementById('banner');
  if (params.has('error')) {
    banner.innerHTML = '<div class="msg err">Wrong username or password.</div>';
  } else if (params.has('logout')) {
    banner.innerHTML = '<div class="msg ok">You have been signed out.</div>';
  } else if (params.has('oauthError')) {
    banner.innerHTML = '<div class="msg err">Google sign-in failed. '
      + 'If this repeats, check that your account is listed as a test user.</div>';
  }

  fetch('/api/auth/providers')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.google) {
        document.getElementById('oauthBlock').style.display = 'block';
      }
    })
    .catch(function () { /* leave the button hidden */ });
</script>
</body>
</html>
