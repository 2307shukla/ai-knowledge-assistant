# Accepted vulnerabilities. Keep this list short: every entry needs a reason and an expiry date.
# After the expiry date Trivy reports the finding again and CI fails until it is reviewed.
#
# These Spring Framework issues are fixed only in Spring Framework 7 (Spring Boot 4). Spring Boot
# 3.5.16 ships the last free 6.2.x release. Agreed on 2026-11-25: stay on 3.5 for Phase 1 and move to
# Spring Boot 4 in Phase 2.
vulnerabilities:
  - id: CVE-2026-47884
    paths: ["app/app.jar"]
    expired_at: 2027-01-31
    statement: >-
      spring-webmvc XsltView path issue. The app has no XsltView or XSLT views. Fix: Spring Boot 4 (Phase 2).
  - id: CVE-2026-47890
    paths: ["app/app.jar"]
    expired_at: 2027-01-31
    statement: >-
      spring-webmvc/webflux. Fix only in Spring Framework 7.0.9. Fix: Spring Boot 4 (Phase 2).
  - id: CVE-2026-47892
    paths: ["app/app.jar"]
    expired_at: 2027-01-31
    statement: >-
      spring-webflux functional endpoints. The app serves no WebFlux endpoints (WebFlux is only the
      HTTP client used by Spring AI). Fix: Spring Boot 4 (Phase 2).
