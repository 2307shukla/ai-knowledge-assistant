# Out-of-the-box local run. No accounts or keys needed to start:
#
#   docker compose up --build            -> http://localhost:8080 (built-in database, resets on restart)
#   docker compose --profile postgres up --build
#                                        -> also http://localhost:8081: same app on a local PostgreSQL + pgvector (data kept in a volume)
#
# Optional settings go in a .env file next to this one (copy .env.example). Without AI_API_KEY the
# app still starts; each user can paste their own free Gemini key in the app (Settings).
services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # Keeps the JVM inside a small container (Render free tier is 512 MB).
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 5

  # Only started with --profile postgres. PostgreSQL and pgvector use the PostgreSQL licence (permissive).
  db:
    profiles: ["postgres"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant-local-only
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      retries: 10

  app-postgres:
    profiles: ["postgres"]
    build: .
    ports:
      - "8081:8080"
    env_file:
      - path: .env
        required: false
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
      DATABASE_URL: "postgresql://assistant:assistant-local-only@db:5432/assistant"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
